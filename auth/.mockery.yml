all: false
dir: "{{.InterfaceDir}}"
force-file-write: true
formatter: goimports
generate: true
include-auto-generated: false
log-level: info
structname: "{{.Mock}}{{.InterfaceName}}"
pkgname: "mocks"
recursive: false
require-template-schema-exists: true
template: testify
template-schema: "{{.Template}}.schema.json"
packages:
  github.com/roledio/roled/auth/internal:
    config:
      all: true
      dir: "{{.InterfaceDirRelative}}/mocks"
      filename: "Mock{{.InterfaceName}}.go"
      recursive: true
  github.com/roledio/roled/auth/pkg:
    config:
      all: true
      dir: "{{.InterfaceDirRelative}}/mocks"
      filename: "Mock{{.InterfaceName}}.go"
      recursive: true

name: Deploy Roled Auth

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy Auth
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate environment input
        run: |
          ENV="${{ github.event.inputs.environment }}"
          if [ "$ENV" != "staging" ] && [ "$ENV" != "production" ]; then
            echo "Invalid environment: $ENV. Use 'staging' or 'production'."
            exit 1
          fi

      - name: Validate workflow ref matches environment
        run: |
          ENV="${{ github.event.inputs.environment }}"
          echo "GITHUB_REF=${GITHUB_REF}"
          if [ "$ENV" = "production" ]; then
            if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
              echo "For production, run this workflow using a tag in 'Use workflow from'."
              exit 1
            fi
          fi

      - name: Checkout selected ref
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install minification tools
        run: |
          npm install -g csso-cli terser html-minifier-terser

      - name: Run minification script
        run: |
          ./.scripts/minify-templates.sh --all --version ${{ github.sha }}

      - name: Determine image tag
        id: set-image
        run: |
          ENV="${{ github.event.inputs.environment }}"
          if [ "$ENV" = "production" ]; then
            echo "image_tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "Using production tag: ${GITHUB_REF_NAME}"
            exit 0
          fi
          # staging: build version-based tag
          GITHUB_SHORT_SHA=${GITHUB_SHA:0:7}
          VERSION="v$(cd auth && make version)"
          BRANCH_NAME="${GITHUB_REF_NAME}"
          IMAGE_TAG="${VERSION}-${GITHUB_SHORT_SHA}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Calculated staging image tag: $IMAGE_TAG"

      - name: Make build script executable
        if: ${{ github.event.inputs.environment == 'staging' }}
        run: chmod +x .scripts/build-image.sh

      - name: Build and publish Docker image (staging)
        if: ${{ github.event.inputs.environment == 'staging' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_TAG_OVERRIDE: ${{ steps.set-image.outputs.image_tag }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          CI_GITHUB_SHA: ${{ github.sha }}
        run: .scripts/build-image.sh

      - name: Trigger infra deployment
        run: |
          IMAGE_TAG="${{ steps.set-image.outputs.image_tag }}"
          echo "Triggering infra for image: $IMAGE_TAG"
          curl -L \
            -X POST ${{ vars.ROLED_INFRA_DISPATCH_URL }} \
            -H "Authorization: token ${{ secrets.ROLED_INFRA_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{
              "event_type": "roled-auth-image-published",
              "client_payload": {
                "environment": "${{ github.event.inputs.environment }}",
                "image_tag": "'${IMAGE_TAG}'"
              }
            }'

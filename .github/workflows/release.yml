name: Release Roled

on:
  workflow_dispatch: {}

jobs:
  release:
    name: Release Auth version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install minification tools
        run: |
          npm install -g csso-cli terser html-minifier-terser

      - name: Run minification script
        run: |
          ./.scripts/minify-templates.sh --all --version ${{ github.sha }}

      - name: Determine release version
        id: version
        run: |
          set -euo pipefail
          VERSION="v$(cd auth && make version)"
          TAG="auth/${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION with git tag: $TAG"

      - name: Make build script executable
        run: chmod +x .scripts/build-image.sh

      - name: Publish Docker image
        run: .scripts/build-image.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_TAG_OVERRIDE: ${{ steps.version.outputs.version }}
          GITHUB_REF_NAME: main
          CI_GITHUB_SHA: ${{ github.sha }}
          PUSH_LATEST: true

      - name: Create git tag
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi
        env:
          TAG: ${{ steps.version.outputs.tag }}

      - name: Bump auth version for the next release
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cd auth
          make bump-version
          NEXT_VERSION="$(make version)"
          git add Makefile

          if git diff --cached --quiet; then
            echo "No version bump commit needed."
          else
            git commit -m "chore: :pushpin: bump auth version to ${NEXT_VERSION}"
            git push origin HEAD:main
          fi

      - name: Generate changelog from merged PRs
        if: success()
        id: changelog
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Get the previous tag (if exists)
          PREVIOUS_TAG=$(git tag -l "auth/*" --sort=-v:refname | head -n 2 | tail -n 1) || true
          CURRENT_TAG="${{ steps.version.outputs.tag }}"

          echo "Previous tag: ${PREVIOUS_TAG}"
          echo "Current tag: ${CURRENT_TAG}"

          # Generate changelog based on merged PRs
          if [ -z "${PREVIOUS_TAG}" ]; then
            # First release - get all PRs
            PR_RANGE="HEAD"
          else
            # Get PRs merged since previous tag
            PR_RANGE="${PREVIOUS_TAG}..HEAD"
          fi

          # Use gh CLI to fetch merged PRs and format them
          CHANGELOG="## What's Changed\n\n"
          
          if command -v gh &> /dev/null; then
            PRS=$(gh pr list --state merged --limit 100 --json number,title,author,url --search "${PR_RANGE}" || true)
            
            if [ -n "${PRS}" ] && [ "${PRS}" != "[]" ]; then
              echo "${PRS}" | jq -r '.[] | "- \(.title) by @\(.author.login) ([#\(.number)](\(.url)))"' >> /tmp/pr_list.txt
              CHANGELOG="${CHANGELOG}$(cat /tmp/pr_list.txt)\n"
            else
              CHANGELOG="${CHANGELOG}No merged PRs found in this range.\n"
            fi
          else
            CHANGELOG="${CHANGELOG}GitHub CLI not available. Please add PRs manually.\n"
          fi

          # Add footer
          CHANGELOG="${CHANGELOG}\n---\n\nFull Changelog: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${CURRENT_TAG}"

          # Save to file and output
          echo "${CHANGELOG}" > /tmp/changelog.md
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "Generated changelog:"
          cat /tmp/changelog.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

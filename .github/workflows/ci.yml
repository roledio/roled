name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ===========================================
  # AUTH (Go) - Lint, Format, Build, Test
  # ===========================================
  auth-lint:
    name: Auth - Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: "auth/go.sum"
      - name: Install mockery
        run: go install github.com/vektra/mockery/v3@v3.8.0
        working-directory: auth
      - name: Debug Go and Mockery
        run: |
          go version
          go env GOVERSION GOTOOLCHAIN GOROOT
          mockery version
          go version -m "$(which mockery)"
      - name: Generate mocks
        run: mockery
        working-directory: auth
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: auth
          args: --timeout=2m
      - name: Check Go formatting
        working-directory: auth
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files are not properly formatted:"
            gofmt -d .
            exit 1
          fi
      - name: Run go vet
        working-directory: auth
        run: go vet ./...
      - name: Build auth binary
        working-directory: auth
        run: make build

  auth-test:
    name: Auth - Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: auth-lint
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: "auth/go.sum"
      - name: Install mockery
        run: go install github.com/vektra/mockery/v3@v3.8.0
        working-directory: auth
      - name: Debug Go and Mockery
        run: |
          go version
          go env GOVERSION GOTOOLCHAIN GOROOT
          mockery version
          go version -m "$(which mockery)"
      - name: Generate mocks
        run: mockery
        working-directory: auth
      - name: Run tests
        working-directory: auth
        run: |
          export JWT_SIGNING_KEY=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-32)
          export ENCRYPTION_MASTER_KEY=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-32)
          export DB_HOST=localhost
          export DB_PASSWORD=$(openssl rand -base64 16 | tr -d "=+/" | cut -c1-16)
          export SMTP_HOST=smtp.gmail.com
          export SMTP_PASSWORD=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-32)
          export NEWRELIC_LICENSE_KEY=$(openssl rand -base64 40 | tr -d "=+/" | cut -c1-40)
          export REDIS_HOST=localhost
          export TESTCONTAINERS_RYUK_DISABLED=true
          make test coverage
      - name: Upload Auth Coverage
        uses: codecov/codecov-action@v5
        with:
          files: auth/coverage.out
          token: ${{ secrets.CODECOV_ORG_TOKEN }}
          fail_ci_if_error: false

  # ===========================================
  # CONSOLE (React/TypeScript) - Lint, Type Check, Build, Test
  # ===========================================
  console-lint:
    name: Console - Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: console/package-lock.json
      - name: Install dependencies
        working-directory: console
        run: npm ci
      - name: Run ESLint
        working-directory: console
        run: npm run lint
      - name: Type check (tsc --noEmit)
        working-directory: console
        run: npx tsc --noEmit
      - name: Build console
        working-directory: console
        run: npm run build

  console-test:
    name: Console - Unit Tests
    runs-on: ubuntu-latest
    needs: console-lint
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: console/package-lock.json
      - name: Install dependencies
        working-directory: console
        run: npm ci
      - name: Run unit tests with coverage
        working-directory: console
        run: npm run test:coverage
      - name: Upload Console Coverage
        uses: codecov/codecov-action@v5
        with:
          files: console/coverage/lcov.info
          token: ${{ secrets.CODECOV_ORG_TOKEN }}
          fail_ci_if_error: false

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ===========================================
  # AUTH (Go) - Lint, Format, Build, Test
  # ===========================================
  auth-lint:
    name: Auth - Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: "auth/go.sum"
      - name: Install mockery
        run: go install github.com/vektra/mockery/v3@v3.6.1
        working-directory: auth
      - name: Generate mocks
        run: mockery
        working-directory: auth
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: auth
          args: --timeout=2m
      - name: Check Go formatting
        working-directory: auth
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files are not properly formatted:"
            gofmt -d .
            exit 1
          fi
      - name: Run go vet
        working-directory: auth
        run: go vet ./...
      - name: Build auth binary
        working-directory: auth
        run: make build

  auth-test:
    name: Auth - Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: auth-lint
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: "auth/go.sum"
      - name: Install mockery
        run: go install github.com/vektra/mockery/v3@v3.6.1
        working-directory: auth
      - name: Generate mocks
        run: mockery
        working-directory: auth
      - name: Run tests
        working-directory: auth
        run: |
          export JWT_SIGNING_KEY=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-32)
          export ENCRYPTION_MASTER_KEY=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-32)
          export DB_HOST=localhost
          export DB_PASSWORD=$(openssl rand -base64 16 | tr -d "=+/" | cut -c1-16)
          export SMTP_HOST=smtp.gmail.com
          export SMTP_PASSWORD=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-32)
          export NEWRELIC_LICENSE_KEY=$(openssl rand -base64 40 | tr -d "=+/" | cut -c1-40)
          export REDIS_HOST=localhost
          export TESTCONTAINERS_RYUK_DISABLED=true
          make test coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-out
          path: auth/coverage.out

  # ===========================================
  # CONSOLE (React/TypeScript) - Lint, Type Check, Build, Test
  # ===========================================
  console-lint:
    name: Console - Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: console/package-lock.json
      - name: Install dependencies
        working-directory: console
        run: npm ci
      - name: Run ESLint
        working-directory: console
        run: npm run lint
      - name: Type check (tsc --noEmit)
        working-directory: console
        run: npx tsc --noEmit
      - name: Build console
        working-directory: console
        run: npm run build

  console-test:
    name: Console - Unit Tests
    runs-on: ubuntu-latest
    needs: console-lint
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: console/package-lock.json
      - name: Install dependencies
        working-directory: console
        run: npm ci
      - name: Run unit tests with coverage
        working-directory: console
        run: npm run test:coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: console-coverage
          path: console/coverage/coverage-summary.json

  sonarcloud-scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: [auth-test, console-test]
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download auth coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-out
      - name: Download console coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: console-coverage
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: console/package-lock.json
      - name: Install console dependencies
        working-directory: console
        run: npm ci
      - name: Generate console coverage for SonarCloud
        working-directory: console
        run: npm run test:coverage
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=roledio_roled
            -Dsonar.organization=roledio
            -Dsonar.sources=auth,console/src
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.javascript.lcov.reportPaths=console/coverage/lcov.info
            -Dsonar.exclusions=auth/**/*_mock.go,auth/mocks/**,auth/cmd/**,auth/configs/**,auth/constants/**,auth/entities/**,auth/errors/**,auth/models/**,auth/views/**,auth/migrations/**,auth/databases/**,auth/types/**,auth/testutil/**,console/src/**/*.test.tsx,console/src/**/*.test.ts,console/src/**/*.spec.tsx,console/src/**/*.spec.ts
            -Dsonar.tests=auth,console/src

  update-badges:
    name: Generate and commit badges
    needs: [auth-test, console-test]
    if: ${{ github.event_name == 'push' && always() }} # Run on push even if tests failed; skip on PR
    outputs:
      latest_sha: ${{ steps.set-latest.outputs.latest_sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Download auth coverage artifact
        if: ${{ needs.auth-test.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: coverage-out
      - name: Generate auth coverage badge
        if: ${{ needs.auth-test.result == 'success' }}
        run: |
          cp coverage.out auth/ || true
          cd auth || exit 1
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//' | cut -d. -f1)
          if [ -z "$COVERAGE" ]; then COVERAGE=0; fi
          if [ "$COVERAGE" -ge 70 ]; then COLOR="brightgreen"; elif [ "$COVERAGE" -ge 40 ]; then COLOR="yellow"; else COLOR="red"; fi
          mkdir -p ../.badges
          curl -o ../.badges/coverage-auth.svg "https://img.shields.io/badge/auth%20coverage-$COVERAGE%25-$COLOR?style=flat-square"
          echo "Auth coverage badge updated: $COVERAGE%"
      - name: Download console coverage artifact
        if: ${{ needs.console-test.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: console-coverage
      - name: Generate console coverage badge
        if: ${{ needs.console-test.result == 'success' }}
        run: |
          cp coverage-summary.json console/ || true
          cd console || exit 1
          COVERAGE=$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('coverage-summary.json')); console.log(Math.floor(d.total.lines.pct))")
          if [ -z "$COVERAGE" ]; then COVERAGE=0; fi
          if [ "$COVERAGE" -ge 70 ]; then COLOR="brightgreen"; elif [ "$COVERAGE" -ge 40 ]; then COLOR="yellow"; else COLOR="red"; fi
          mkdir -p ../.badges
          curl -o ../.badges/coverage-console.svg "https://img.shields.io/badge/console%20coverage-$COVERAGE%25-$COLOR?style=flat-square"
          echo "Console coverage badge updated: $COVERAGE%"
      - name: Generate version badge
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="v$(cd auth && make version)"
          mkdir -p ./.badges
          curl -o ./.badges/version.svg "https://img.shields.io/badge/version-${VERSION}-blue?style=flat-square"
          echo "Badge updated with version: ${VERSION}"
      - name: Generate build status badge (based on tests)
        run: |
          if [ "${{ needs.auth-test.result }}" == "success" ] && [ "${{ needs.console-test.result }}" == "success" ]; then
            COLOR="brightgreen"
            STATUS="passing"
          else
            COLOR="red"
            STATUS="failing"
          fi
          mkdir -p ./.badges
          curl -o ./.badges/build.svg "https://img.shields.io/badge/build-$STATUS-$COLOR?style=flat-square"
          echo "Badge updated with build status: ${STATUS}"
      - name: Commit badges
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ./.badges || true
          if git diff --cached --quiet; then
            echo "No badge changes to commit."
          else
            git stash push -m "badge changes" || true
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git stash pop || true
            git add ./.badges
            git commit -m "chore: :pushpin: update badges"
            git push origin "${GITHUB_REF_NAME}"
            echo "Badges pushed to ${GITHUB_REF_NAME}"
          fi
      - name: Set latest SHA output
        id: set-latest
        run: |
          # Use local HEAD which reflects any badge commit just made in this job
          LATEST_SHA=$(git rev-parse HEAD)
          echo "latest_sha=${LATEST_SHA}" >> $GITHUB_OUTPUT
          echo "Determined latest SHA from local HEAD: ${LATEST_SHA}"

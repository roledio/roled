name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ===========================================
  # AUTH (Go) - Lint, Format, Build, Test
  # ===========================================
  auth-lint:
    name: Auth - Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: "auth/go.sum"
      - name: Install mockery
        run: go install github.com/vektra/mockery/v3@v3.6.1
        working-directory: auth
      - name: Generate mocks
        run: mockery
        working-directory: auth
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: auth
          args: --timeout=2m
      - name: Check Go formatting
        working-directory: auth
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files are not properly formatted:"
            gofmt -d .
            exit 1
          fi
      - name: Run go vet
        working-directory: auth
        run: go vet ./...
      - name: Build auth binary
        working-directory: auth
        run: make build

  auth-test:
    name: Auth - Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: auth-lint
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: "auth/go.sum"
      - name: Install mockery
        run: go install github.com/vektra/mockery/v3@v3.6.1
        working-directory: auth
      - name: Generate mocks
        run: mockery
        working-directory: auth
      - name: Run tests
        working-directory: auth
        run: |
          export JWT_SIGNING_KEY=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-32)
          export ENCRYPTION_MASTER_KEY=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-32)
          export DB_HOST=localhost
          export DB_PASSWORD=$(openssl rand -base64 16 | tr -d "=+/" | cut -c1-16)
          export SMTP_HOST=smtp.gmail.com
          export SMTP_PASSWORD=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-32)
          export NEWRELIC_LICENSE_KEY=$(openssl rand -base64 40 | tr -d "=+/" | cut -c1-40)
          export REDIS_HOST=localhost
          export TESTCONTAINERS_RYUK_DISABLED=true
          make test coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-out
          path: auth/coverage.out

  # ===========================================
  # CONSOLE (React/TypeScript) - Lint, Type Check, Build, Test
  # ===========================================
  console-lint:
    name: Console - Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: console/package-lock.json
      - name: Install dependencies
        working-directory: console
        run: npm ci
      - name: Run ESLint
        working-directory: console
        run: npm run lint
      - name: Type check (tsc --noEmit)
        working-directory: console
        run: npx tsc --noEmit
      - name: Build console
        working-directory: console
        run: npm run build

  console-test:
    name: Console - Unit Tests
    runs-on: ubuntu-latest
    needs: console-lint
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: console/package-lock.json
      - name: Install dependencies
        working-directory: console
        run: npm ci
      - name: Run unit tests with coverage
        working-directory: console
        run: npm run test:coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: console-coverage
          path: console/coverage/coverage-summary.json

  sonarcloud-auth:
    name: SonarCloud - Auth
    runs-on: ubuntu-latest
    needs: auth-test
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download auth coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-out
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=roledio_roled_auth
            -Dsonar.organization=roledio
            -Dsonar.sources=auth
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.exclusions=auth/**/*_mock.go,auth/mocks/**,auth/cmd/**,auth/configs/**,auth/constants/**,auth/entities/**,auth/errors/**,auth/models/**,auth/views/**,auth/migrations/**,auth/databases/**,auth/types/**,auth/testutil/**,auth/**/*_test.go
            -Dsonar.tests=auth/**/*_test.go

  sonarcloud-console:
    name: SonarCloud - Console
    runs-on: ubuntu-latest
    needs: console-test
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: console/package-lock.json
      - name: Install dependencies
        working-directory: console
        run: npm ci
      - name: Generate coverage report for SonarCloud
        working-directory: console
        run: npm run test:coverage
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=roledio_roled_console
            -Dsonar.organization=roledio
            -Dsonar.sources=console/src
            -Dsonar.javascript.lcov.reportPaths=console/coverage/lcov.info
            -Dsonar.exclusions=console/src/**/*.test.tsx,console/src/**/*.test.ts,console/src/**/*.spec.tsx,console/src/**/*.spec.ts
            -Dsonar.test.inclusions=console/src/**/*.test.tsx,console/src/**/*.test.ts

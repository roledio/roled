services:
  mariadb:
    image: mariadb:11.8
    container_name: roled-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: roled-redis
    restart: unless-stopped
    # Redis configuration optimized for hybrid queue & cache workloads:
    # - AOF enabled (appendfsync everysec) for queue durability across restarts
    # - volatile-lru policy to evict TTL-based cache keys while preserving persistent queue streams
    # - maxmemory capped at 192mb to stay safely within the 256M container limit
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 192mb
      --maxmemory-policy volatile-lru
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  auth:
    container_name: roled-auth
    restart: unless-stopped
    build:
      context: ./auth
      dockerfile: Dockerfile
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"
    env_file:
      - .env
    environment:
      PORT: ${AUTH_PORT}
      DB_PORT: 3306
      REDIS_PORT: 6379
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${AUTH_PORT}/system/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  console:
    container_name: roled-console
    restart: unless-stopped
    build:
      context: ./console
      dockerfile: Dockerfile
      args:
        - VITE_AUTH_BASE_URL
        - VITE_DOCS_BASE_URL
        - VITE_PORT=${CONSOLE_PORT}
    ports:
      - "${CONSOLE_PORT}:80"
    depends_on:
      auth:
        condition: service_healthy

volumes:
  mariadb_data:
  redis_data:
